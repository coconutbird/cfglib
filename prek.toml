minimum_prek_version = "0.4.14"
default_install_hook_types = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "repository-policy"
name = "repository policy"
entry = "python scripts/check_repository_policy.py"
language = "python"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --all -- --check"
entry = "cargo fmt --all -- --check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy --workspace --all-targets --all-features"
entry = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::pedantic"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-test"
name = "cargo test --workspace --all-features"
entry = "cargo test --workspace --all-features --locked"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
